name: OQuaRE Evaluation

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    name: Evaluate ontologies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run OQuaRE
        uses: tecnomod-um/oquare-metrics@v3.0
        with:
          ontology-files: ontologi_tanaman_obat.owl
          contents-folder: OQuaRE
          reasoner: ELK
